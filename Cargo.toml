[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/SanowerTamjit/setu"
homepage = "https://github.com/SanowerTamjit/setu"
authors = ["Setu contributors"]

[workspace.dependencies]
setu-core = { path = "crates/setu-core", version = "0.0.1" }
setu-pty = { path = "crates/setu-pty", version = "0.0.1" }
setu-ssh = { path = "crates/setu-ssh", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
