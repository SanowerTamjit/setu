name: Feature request
description: Suggest an idea for Setu
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Setu to do?
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options:
        - System engineer / administrator
        - DevOps / SRE
        - SecOps
        - NetOps
        - IT operations / service desk
        - Other
      multiple: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Tools or workarounds you use today.
