# Groups GitHub's generated release notes by pull request label. The
# hand-written notes come from CHANGELOG.md; these are the full list.
changelog:
  exclude:
    labels: [no-changelog, dependencies-internal]
  categories:
    - title: Security
      labels: [security]
    - title: New
      labels: [feature, enhancement]
    - title: Fixed
      labels: [bug]
    - title: Docs
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
