name: OpenSSF Scorecard

# Checks the project against the OpenSSF supply-chain practices (pinned
# dependencies, branch protection, code review, signed releases, ...) and
# shows the results under Security → Code scanning and on scorecard.dev.

on:
  push:
    branches: [master]
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results
      id-token: write # publish results to scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: results.sarif
