name: Security audit

# New advisories are published every day, for code that has not changed.
# This checks the locked Rust and npm dependencies daily, so a new CVE in
# something Setu ships fails here (and shows on the Actions tab) instead of
# waiting for the next pull request.

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [Cargo.lock, pnpm-lock.yaml, deny.toml]

permissions:
  contents: read

jobs:
  rust:
    name: Rust advisories (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2
        with:
          command: check advisories

  npm:
    name: npm advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm audit --audit-level moderate
