version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are pinned to commit SHAs (with the tag in a comment);
    # Dependabot moves the SHA and the comment together.
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned to a commit of its master branch; the toolchain is an input.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
