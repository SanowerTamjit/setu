[package]
name = "setu-cli"
description = "The `setu` command line: saved hosts and `setu doctor`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "setu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
serde_json = "1"
setu-core.workspace = true
setu-hosts.workspace = true
setu-ssh.workspace = true
setu-vault.workspace = true
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
