[package]
name = "setu-net"
description = "Network tools for Setu: port checks, DNS lookups and Wake-on-LAN"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["net", "time", "rt", "io-util"] }
# TLS certificate check: rustls with ring (already in the tree through
# russh), the system's trusted roots, and x509-cert to read certificates
# (shares der/spki/const-oid with what the tree already has).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
x509-cert = { version = "0.3", default-features = false }
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[lints]
workspace = true
