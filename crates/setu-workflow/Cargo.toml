[package]
name = "setu-workflow"
description = "Visual workflows for Setu: steps that run commands on saved hosts, in order or in parallel, with approvals and run history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
toml = "1"
# Already in the tree through russh and Tauri: runs steps side by side, with timeouts.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
