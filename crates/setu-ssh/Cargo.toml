[package]
name = "setu-ssh"
description = "SSH connections for Setu, the open-source ops IDE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
setu-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "fs", "io-util"] }
zeroize = "1"
russh-sftp = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs"] }
tempfile = "3"

[lints]
workspace = true
