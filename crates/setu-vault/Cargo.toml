[package]
name = "setu-vault"
description = "Setu's encrypted local vault for SSH passwords and key passphrases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
