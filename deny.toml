# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin attack: timing side channel in the `rsa` crate's private-key
  # operations. No fixed release exists yet. Setu uses RSA only to sign SSH
  # user-auth challenges locally, where an attacker cannot time many
  # operations; RSA support stays because many users still have id_rsa keys.
  # Revisit when `rsa` ships a constant-time release.
  { id = "RUSTSEC-2023-0071", reason = "no fix available; local SSH user-auth signing only" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
