[package]
name = "setu-desktop"
description = "Setu desktop app: the open-source ops IDE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
name = "setu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
setu-core.workspace = true
setu-pty.workspace = true
setu-ssh.workspace = true
zeroize = "1"
setu-hosts.workspace = true
setu-workflow.workspace = true
setu-memory.workspace = true
setu-net.workspace = true
setu-vault = { workspace = true, features = ["os-keychain"] }
serde.workspace = true
serde_json = "1"
# Imported terminal colour schemes: iTerm2 .itermcolors (property lists) and
# Alacritty .toml. Both are already in the tree (Tauri, setu-hosts).
plist = "1.10"
toml = "1"
tauri = { version = "2.11", features = [] }
# Opens a sign-in page in the system browser when a build's settings page
# asks (ActionOutcome::OpenUrl). The official Tauri plugin; no JS permission
# is granted, so only Rust code can use it.
tauri-plugin-opener = "2.7"
tokio = { version = "1", features = ["time", "sync"] }
# Private, randomly named folders for files edited in a local editor.
tempfile = "3.20"

[lints]
workspace = true
