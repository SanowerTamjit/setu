<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setu</title>
  </head>
  <body>
    <div id="app">
      <header class="tabbar" role="tablist" aria-label="Terminal tabs">
        <button id="sidebar-button" class="icon-button sidebar-toggle" title="Hosts (Ctrl+Shift+H)" aria-label="Show hosts" aria-pressed="true">☰</button>
        <div id="tabs" class="tabs"></div>
        <div class="new-tab">
          <button id="new-tab" class="icon-button" title="New tab (Ctrl+Shift+T)" aria-label="New tab">+</button>
          <button id="shell-menu-button" class="icon-button chevron" title="Choose a shell" aria-label="Choose a shell" aria-haspopup="menu" aria-expanded="false">▾</button>
          <div id="shell-menu" class="menu" role="menu" hidden></div>
        </div>
      </header>
      <div class="workspace">
        <aside id="sidebar" class="sidebar" aria-label="Saved hosts"></aside>
        <main id="terminals" class="terminals"></main>
      </div>
      <footer class="statusbar">
        <span id="status-shell"></span>
        <span id="status-size"></span>
        <button id="status-files" class="status-button files-button" title="Browse and copy files on this server (Ctrl+Shift+F)" hidden>⇅ Files</button>
        <button id="status-vault" class="status-button" title="Open the vault"></button>
        <span id="status-version" class="muted"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
